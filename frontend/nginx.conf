server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location = /internal/health/gateway {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway/actuator/health;
        proxy_set_header Host $host;
    }

    location = /internal/health/solicitudes {
        set $solicitudes http://solicitud-service:8081;
        proxy_pass $solicitudes/actuator/health;
        proxy_set_header Host $host;
    }

    location = /internal/health/evaluaciones {
        set $evaluaciones http://evaluacion-service:8082;
        proxy_pass $evaluaciones/actuator/health;
        proxy_set_header Host $host;
    }

    location = /internal/health/auth {
        set $auth http://auth-service:8083;
        proxy_pass $auth/auth/actuator/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
