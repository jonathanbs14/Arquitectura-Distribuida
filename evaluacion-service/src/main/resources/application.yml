server:
  port: 8082

spring:
  application:
    name: evaluacion-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:evaluaciones;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:credit}
    password: ${SPRING_DATASOURCE_PASSWORD:credit}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: evaluacion-service-v1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 10
      session-timeout-ms: 30000
    listener:
      ack-mode: record
      poll-timeout: 3000
      concurrency: 3
      type: batch
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}


management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: api-service


app:
  kafka:
    solicitud-creada-topic: credito.solicitud.creada.v1
    solicitud-creada-dlq-topic: credito.solicitud.creada.v1-dlq
    max-retry-attempts: 3
    initial-interval-ms: 1000
    max-interval-ms: 10000
    multiplier: 2.0
  outbox:
    publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}
